let currentIndex = 0;
let answers = loadAnswers();
const app = document.getElementById("app");

function loadAnswers(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){
    return [];
  }
}

function saveAnswers(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(answers));
}

function startScreen(){
  const canResume = answers.length > 0 && answers.length < questions.length;
  if(canResume){ currentIndex = answers.length; }

  app.innerHTML = `

function resumeCheck(){
  currentIndex = answers.length;
  renderQuestion();
}

function restartFromBeginning(){
  localStorage.removeItem(STORAGE_KEY);
  answers = [];
  currentIndex = 0;
  renderQuestion();
}

function renderQuestion(){
  if(currentIndex >= questions.length){
    renderResult();
    return;
  }

  const q = questions[currentIndex];
  const progress = ((currentIndex + 1) / questions.length) * 100;

  app.innerHTML = `
    <div class="progress">${currentIndex + 1} / ${questions.length}</div>
    <div class="bar"><div class="barInner" style="width:${progress}%"></div></div>
    <div class="domain">${q[1]}</div>
    <div class="q">${q[2]}</div>
    <div class="grid">
      <button class="yes" onclick="answerQuestion(1)">はい</button>
      <button class="no" onclick="answerQuestion(0)">いいえ</button>
    </div>
    <button class="back" onclick="goBack()">← 戻る</button>
  `;
}

function answerQuestion(value){
  answers[currentIndex] = value;
  currentIndex++;
  saveAnswers();
  renderQuestion();
}

function goBack(){
  if(currentIndex > 0){
    currentIndex--;
    answers = answers.slice(0, currentIndex);
    saveAnswers();
    renderQuestion();
  }else{
    startScreen();
  }
}

function calcResult(){
  const scores = {house:0, iso:0, life:0, health:0, money:0, end:0};
  questions.forEach((q, idx) => {
    scores[q[0]] += answers[idx] || 0;
  });
  const total = answers.reduce((sum, v) => sum + (v || 0), 0);
  const priority = {life:0, health:1, iso:2, house:3, money:4, end:5};
  const sorted = Object.entries(scores).sort((a,b) => {
    if (b[1] !== a[1]) return b[1] - a[1];
    return priority[a[0]] - priority[b[0]];
  });
  return {scores, total, sorted};
}

function getDomainVideoCandidates(domainKey){
  const map = {
    life:[6,7,18],
    health:[15,16,3],
    iso:[5,17,2],
    house:[11,12,19,25],
    money:[13,14,20],
    end:[19,23,25,30]
  };
  return map[domainKey] || [];
}

function getConsultVideos(){
  return [21,22,24,27];
}

function uniquePush(arr, value){
  if(!arr.includes(value)) arr.push(value);
}

function chooseRelatedVideos(total, topDomains, scores){
  const selected = [];

  if(total <= 4){
    uniquePush(selected, 31);
    uniquePush(selected, 32);
    return selected.slice(0,2);
  }

  const firstKey = topDomains[0] ? topDomains[0][0] : null;
  const secondKey = topDomains[1] ? topDomains[1][0] : null;

  if(total <= 14){
    if(firstKey){
      const candidates = getDomainVideoCandidates(firstKey);
      if(candidates[0]) uniquePush(selected, candidates[0]);
      if(candidates[1]) uniquePush(selected, candidates[1]);
    }
    if(selected.length < 2 && secondKey){
      const candidates2 = getDomainVideoCandidates(secondKey);
      candidates2.forEach(v => {
        if(selected.length < 2) uniquePush(selected, v);
      });
    }
    if(selected.length < 2){
      uniquePush(selected, 1);
      uniquePush(selected, 30);
    }
    return selected.slice(0,2);
  }

  if(total <= 24){
    if(firstKey){
      const candidates = getDomainVideoCandidates(firstKey);
      if(candidates[0]) uniquePush(selected, candidates[0]);
    }
    if((scores.life || 0) >= 4 || (scores.health || 0) >= 4){
      uniquePush(selected, 21);
    }else{
      uniquePush(selected, getConsultVideos()[0]);
    }
    if(selected.length < 2 && secondKey){
      const candidates2 = getDomainVideoCandidates(secondKey);
      candidates2.forEach(v => {
        if(selected.length < 2) uniquePush(selected, v);
      });
    }
    return selected.slice(0,2);
  }

  if(firstKey){
    const candidates = getDomainVideoCandidates(firstKey);
    if(candidates[0]) uniquePush(selected, candidates[0]);
  }
  if((scores.life || 0) >= 4 || (scores.health || 0) >= 4){
    uniquePush(selected, 27);
  }else{
    uniquePush(selected, 21);
  }
  if(selected.length < 2) uniquePush(selected, 22);
  return selected.slice(0,2);
}

async function fetchAiComment(total, topDomains, scores){
  try{
    const res = await fetch(AI_WEBAPP_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        total: total,
        topDomains: topDomains.map(([key]) => domainInfo[key].label),
        scores: scores
      })
    });
    const text = await res.text();
    const data = JSON.parse(text);
    if(data.ok && data.aiComment){
      return data.aiComment;
    }
  }catch(e){}
  return buildLocalAiComment(total, topDomains, scores);
}

      <p>上位リスクに合わせて、固定している動画の中から2本を表示しています。</p>
      ${renderRiskLinks(result.total, topDomains, result.scores)}
    </div>

    <div class="section">
      <h2>志木モデルYouTubeチャンネル</h2>
      <a class="video" href="${YOUTUBE_CHANNEL_URL}" target="_blank" rel="noopener noreferrer">志木モデルYouTubeチャンネルを開く</a>
    </div>

    <button class="restart" onclick="restartToTop()">もう一度チェックする</button>
  `;
}

function restartToTop(){
  localStorage.removeItem(STORAGE_KEY);
  answers = [];
  currentIndex = 0;
  startScreen();
}

window.resumeCheck = resumeCheck;
window.restartFromBeginning = restartFromBeginning;
window.answerQuestion = answerQuestion;
window.goBack = goBack;
window.restartToTop = restartToTop;
window.copyLineComment = copyLineComment;

startScreen();
</script>
</body>
</html>
